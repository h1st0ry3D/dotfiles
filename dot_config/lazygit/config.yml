# hunk diff config
git:
  diffRenderers:
    - colorArg: always
      command: hunk pager
# Key bindings
customCommands:
  - key: 'x'
    context: 'files'
    description: 'Stage all, commit and push'
    loadingText: 'Staging, committing and pushing...'
    prompts:
      - type: 'input'
        title: 'Enter commit message'
    command: |
      git add -A &&
      git commit -m "{{index .PromptResponses 0}}" &&
      git push
    output: log
  - key: 'n'
    context: 'localBranches'
    prompts:
      - type: 'menu'
        title: 'What kind of branch is it?'
        key: 'BranchType'
        options:
          - name: 'feature'
            value: 'feature'
          - name: 'hotfix'
            value: 'hotfix'
          - name: 'release'
            value: 'release'
      - type: 'input'
        title: 'What is the new branch name?'
        key: 'BranchName'
        initialValue: ''
    command: "git checkout -b {{.Form.BranchType}}/$(echo '{{.Form.BranchName}}' | tr ' ' '-')"
    loadingText: 'Creating branch'
# Vesper theme
gui:
  theme:
    activeBorderColor:
      - "#FFCFA8"
      - bold
    inactiveBorderColor:
      - "#444444"
    searchingActiveBorderColor:
      - "#FFC799"
    defaultFgColor:
      - "#FFFFFF"
    optionsTextColor:
      - "#FFCFA8"
    selectedLineBgColor:
      - "#444444"
    unstagedChangesColor:
      - "#FFCFA8"
    cherryPickedCommitFgColor:
      - "#FFCFA8"
    cherryPickedCommitBgColor:
      - "#505050"
  authorColors:
    '*': '#65737E'
keybinding:
  universal:
    prevScreenMode: '#'
    nextTab: 'ä'
    prevTab: 'ö'
# VS Code extension
os:
  editPreset: "vscode"
promptToReturnFromSubprocess: false
