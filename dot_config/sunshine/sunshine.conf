# Force VAAPI encoding onto the same GPU that Hyprland composites on.
#
# Hyprland's renderer is on /dev/dri/renderD128 (Intel UHD 630, primary DRM device).
# Sunshine's wlgrab captures wlr-screencopy dmabufs from that context, but Sunshine
# defaults to /dev/dri/renderD129 (AMD Navi 14) for VAAPI encode. Cross-vendor
# dma-buf import into VCN fails silently and yields black frames.
adapter_name = /dev/dri/renderD128

# --- Stability overrides (added 2026-10-27) ---
# Pin VA-API. On this machine the NVENC and Vulkan probes always fail, so
# autodetect only adds ~1s of startup delay and error spam before falling
# back to VA-API anyway.
encoder = vaapi

# Real cause of the SIGABRT crash loop (upstream Sunshine #5792): the VAAPI
# quality setting is forwarded to the driver as compression_level, and the
# default "auto" maps to level 0. Intel's iHD driver rejects level 0 for
# HEVC, so the first frame fails with "Failed to end picture encode issue:
# 24", FFmpeg then hits av_assert0(pic->nb_dpb_pics < 16) in hw_base_encode.c
# and abort()s the whole process.
# "speed" maps to level 7, which iHD accepts. Alternatives if ever needed:
# vaapi_quality = quality (level 1). Avoid "balanced" (level 3, also buggy).
vaapi_quality = speed

# --- Capture the virtual output, not the physical one ---
# The Dell drops off the DisplayPort link when it is powered off, so capturing
# it meant Sunshine lost its source and Moonlight went black. STREAM is the
# persistent headless output the Dell mirrors (see ~/.config/hypr/monitors.lua),
# so the capture target never disappears.
output_name = STREAM